[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motor-pricing"
version = "0.1.0"
description = "Motor insurance pricing: Poisson/Gamma GLMs vs LightGBM, MLflow tracking and a FastAPI quote service"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "statsmodels>=0.14.2",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
    "mlflow>=2.14",
    "matplotlib>=3.8",
    "pyarrow>=15",
    "pandera>=0.20",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/motor_pricing"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
